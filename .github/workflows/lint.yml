name: lint
on: [push, pull_request]
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -S warning *.sh
      - name: syntax check
        run: bash -n install.sh && bash -n install-debian.sh && bash -n install-rhel.sh && bash -n check-k8s.sh && bash -n uninstall.sh
